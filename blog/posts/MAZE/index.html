e-content"><h1 id="%E8%BF%B7%E5%AE%AB%E5%AD%98%E6%A1%A3" tabindex="-1">迷宫存档</h1><p>（隐藏博文）</p><p>这些是我小学到高中画的部分迷宫</p><p>在这里的迷宫都是拥有者巨大工程量的一个整体</p><p><a href="../%E4%B8%80%E4%B8%AA%E8%BF%B7%E5%AE%AB%E7%9A%84%E4%BB%8B%E7%BB%8D" target="_blank" rel="noopener">教程</a></p><table class="mdui-table"><thead><tr><th style="text-align:center">序号</th><th style="text-align:center">第一页</th><th style="text-align:center">第二页或注释</th></tr></thead><tbody><tr><td style="text-align:center">1</td><td style="text-align:center"><img src="../../img/1-page1.jpg" alt="1-page1"></td><td style="text-align:center"><img src="../../img/1-page2.jpg" alt="1-page2"></td></tr><tr><td style="text-align:center">2</td><td style="text-align:center"><img src="../../img/2-page1.jpg" alt="2-page1"></td><td style="text-align:center"><img src="../../img/2-page2.jpg" alt="2-page2"></td></tr><tr><td style="text-align:center">3</td><td style="text-align:center"><img src="../../img/3-page1-2.jpeg" alt="3"></td><td style="text-align:center">两页经过后期拼接</td></tr><tr><td style="text-align:center">4</td><td style="text-align:center"><img src="../../img/4-page1.jpeg" alt="4-page1"></td><td style="text-align:center"><img src="../../img/4-page2.jpeg" alt="4-page2"></td></tr><tr><td style="text-align:center">6</td><td style="text-align:center"><img src="../../img/6-page1.jpg" alt="6-page1"></td><td style="text-align:center"><img src="../../img/6-page2.jpg" alt="6-page2"></td></tr><tr><td style="text-align:center">7</td><td style="text-align:center"><img src="../../img/7-page.jpg" alt="7-page"></td><td style="text-align:center">一张很大的草稿纸</td></tr></tbody></table><p>特殊的：</p><table class="mdui-table"><thead><tr><th style="text-align:center">序号</th><th style="text-align:center">-</th><th style="text-align:center">-</th><th style="text-align:center">-</th><th style="text-align:center">-</th></tr></thead><tbody><tr><td style="text-align:center">5</td><td style="text-align:center">第一面-折叠</td><td style="text-align:center">第一面-展开</td><td style="text-align:center">第二面-折叠</td><td style="text-align:center">第二面-展开</td></tr><tr><td style="text-align:center">5</td><td style="text-align:center"><img src="../../img/5-page1-folded.jpg" alt="5-page1-folded"></td><td style="text-align:center"><img src="../../img/5-page1-opened.jpg" alt="5-page1-opened"></td><td style="text-align:center"><img src="../../img/5-page2-folded.jpg" alt="5-page2-folded"></td><td style="text-align:center"><img src="../../img/5-page2-opened.jpg" alt="5-page2-opened"></td></tr></tbody></table><p>注：</p><ul><li>可以通过边缘来到另一面，不过注意是纸张边缘，也就是说左边缘和另一张的右边缘高度一致的为同一路径，上边缘和另一张的上边缘横向镜像的位置为同一路径，建议双面打印游玩</li><li>5比较小巧，但是只需哦难度极大，需要借助开关纸张找到路径</li></ul></article><div class="auto-box postnav"><mdui-tooltip class="newer-post" content=""><mdui-card disabled class="v-box" variant="outlined" clickable><span class="h-box"><mdui-icon-arrow-back></mdui-icon-arrow-back><span><!----></span></span><span class="other-post-title"><!----></span></mdui-card></mdui-tooltip><div class="h-box postnav-part2"><mdui-tooltip content="" class="older-post"><mdui-card disabled class="v-box" variant="outlined" clickable><span class="h-box"><span><!----></span><mdui-icon-arrow-forward></mdui-icon-arrow-forward></span><span class="other-post-title"><!----></span></mdui-card></mdui-tooltip><mdui-tooltip content=""><mdui-card class="v-box rand-post" variant="outlined" clickable style="cursor: none !important;" disabled><mdui-icon-shuffle></mdui-icon-shuffle></mdui-card></mdui-tooltip></div></div><div class="giscus"></div></main><aside><mdui-navigation-drawer modal close-on-esc close-on-overlay-click placement="right"><mdui-list class="toc-list"></mdui-list></mdui-navigation-drawer></aside><script id="toc-json" type="application/json">[{"text":"迷宫存档","slug":"%E8%BF%B7%E5%AE%AB%E5%AD%98%E6%A1%A3","children":null}]</script><script id="cate-tag-json" type="application/json">{"category":null,"tags":null,"date":null}</script><script type="application/json" id="postnav-json">{"zh-CN":{"newe
