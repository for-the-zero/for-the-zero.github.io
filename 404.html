<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
</head>
<body>
    <center>
        <h1>Redirecting...</h1>
        <hr />
        <script>
            const path = window.location.pathname;
            const config = {
                "title": "你怎么还在用Github Pages？",
                "desc": "呐呐~ 你在访问Github Pages的域名哦？\n哼！都什么时候了还用这个又破又烂的玩意\n我给你几个新的域名吧喵，以后就用这几个了！",
                "links": [
                    {"name": "Netlify", "url": "https://ftz.is-a.dev"},
                    {"name": "Vercel", "url": "https://ftz.cc.cd"},
                    {"name": "Cloudflare Pages", "url": "https://ftz.pages.dev"},
                    {"name": "还有个Hexo版本的旧博客（或许你要访问这个）", "url": "https://for-the-zero.github.io/blog-old"}
                ],
                "tgb": false
            };
            // append current path to each link
            config.links = config.links.map(l => ({ ...l, url: l.url + path }));
            const json = JSON.stringify(config);
            const target = 'https://tooys.pages.dev/builts/selinkt/?' + json;
            document.getElementById('fallback').href = target;
            window.location.href = target;
        </script>
        <a id="fallback" href="#">Click here if you are not redirected.</a>
    </center>
</body>
</html>
